  <style>
    :root{--brand:#ff7a1a;--ink:#10151b;--ink-2:#46525e;--ff:'Manrope',system-ui,sans-serif;--ff-head:'Oswald',sans-serif}
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:var(--ff);color:var(--ink);background:#f7f8fa;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
    .nf{text-align:center;max-width:560px}
    .nf__code{font-family:var(--ff-head);font-weight:700;font-size:clamp(72px,18vw,140px);line-height:1;color:var(--brand)}
    .nf__code span{color:var(--ink)}
    .nf h1{font-family:var(--ff-head);font-size:clamp(20px,4vw,28px);text-transform:uppercase;margin:16px 0 8px;letter-spacing:.4px}
    .nf p{color:var(--ink-2);font-size:16px;margin-bottom:24px}
    .nf__actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
    .nf__btn{display:inline-block;padding:12px 24px;border-radius:12px;font-weight:700;text-decoration:none;font-size:15px}
    .nf__btn--primary{background:var(--brand);color:#fff}
    .nf__btn--primary:hover{background:#e56607}
    .nf__btn--ghost{border:1.5px solid #d5dce2;color:var(--ink)}
    .nf__btn--ghost:hover{border-color:var(--brand);color:var(--brand)}
    .nf__btn--phone{border:1.5px solid #d5dce2}
    .nf__small{margin-top:28px;font-size:13px;color:#8b959e}
  </style>
